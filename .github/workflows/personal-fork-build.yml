name: Personal Fork Build

# Builds Linux x86_64 + Android APK on every push to the fork branch.
# Both artifacts are attached to a GitHub Release named after the commit SHA
# so they're easy to grab from the Releases page on any device.
#
# Triggers:
#   - push to any branch
#   - manual run via workflow_dispatch
#
# Outputs:
#   - Fladder-linux-x86_64.tar.gz   (extract + run ./Fladder)
#   - Fladder-android.apk           (sideload to phone / Android TV / Chromecast TV)

on:
  push:
    branches:
      - "**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch-info:
    runs-on: ubuntu-latest
    outputs:
      flutter_version: ${{ steps.fv.outputs.flutter_version }}
      short_sha: ${{ steps.fv.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Flutter version + commit info
        id: fv
        run: |
          FV=$(jq -r .flutter .fvmrc)
          echo "flutter_version=$FV" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  build-linux:
    needs: fetch-info
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake clang pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libmpv-dev mpv

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.fetch-info.outputs.flutter_version }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build runner (generated code)
        run: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Linux release (x86_64)
        run: flutter build linux --release

      - name: Package Linux build
        run: |
          cd build/linux/x64/release/bundle
          tar -czf "${GITHUB_WORKSPACE}/Fladder-linux-x86_64.tar.gz" *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fladder-linux-x86_64
          path: Fladder-linux-x86_64.tar.gz
          retention-days: 30

  build-android:
    needs: fetch-info
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.fetch-info.outputs.flutter_version }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build runner (generated code)
        run: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Android APK (debug variant — auto-signed for sideload)
        # We don't have the upstream's release keystore (it's a private
        # GitHub Secret), so we build the debug variant which gets signed
        # with Android's standard debug key. Sideloads fine on any personal
        # Android TV / phone / Chromecast TV / Nvidia Shield.
        # --verbose surfaces gradle errors that flutter would otherwise
        # swallow — without it a failed build prints only the cryptic
        # "Gradle build failed to produce an .apk file" message.
        run: flutter build apk --debug --verbose

      - name: Stage APK
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk Fladder-android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fladder-android
          path: Fladder-android.apk
          retention-days: 30

  release:
    needs: [fetch-info, build-linux, build-android]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create / update rolling release
        uses: softprops/action-gh-release@v2
        with:
          name: "Personal fork build (${{ needs.fetch-info.outputs.short_sha }})"
          tag_name: "fork-${{ needs.fetch-info.outputs.short_sha }}"
          body: |
            Auto-built from commit ${{ github.sha }}.

            **Linux x86_64**: download `Fladder-linux-x86_64.tar.gz`, extract anywhere, run `./fladder`.
            Requires `mpv` / `libmpv2` installed on the host (CachyOS: `sudo pacman -S mpv`).

            **Android (phone / Android TV / Chromecast TV / Nvidia Shield)**: download `Fladder-android.apk` and sideload.
            On Android TV, the easiest method is the "Downloader" app from the Play Store — paste the APK URL, it downloads + installs.

            ## What's different from upstream
            - **`.strm` playback fix**: cancels the runaway retry timer in `lib_mpv.dart` once the stream actually starts. Was causing audio-only playback on Easynews / HTTP-streamed content.
            - **Auto-update disabled**: this fork doesn't check for updates, so no nag screen will appear and a "stable" build won't suddenly become unstable from an upstream regression.
          files: |
            dist/Fladder-linux-x86_64.tar.gz
            dist/Fladder-android.apk
          generate_release_notes: false
          fail_on_unmatched_files: true
